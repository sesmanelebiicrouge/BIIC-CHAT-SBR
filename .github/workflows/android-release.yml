name: BIIC CHAT Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.biicchat --project-name biic_chat_sbr .

      - name: Configure BIIC CHAT Android identity and permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          p.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.biicchat.biic_chat_sbr">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <application
                  android:label="BIIC CHAT"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          """)
          gradle=Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle=Path("android/app/build.gradle")
          s=gradle.read_text()
          s=s.replace('applicationId = "com.example.biic_chat_sbr"', 'applicationId = "com.biicchat.biic_chat_sbr"')
          s=s.replace('namespace = "com.example.biic_chat_sbr"', 'namespace = "com.biicchat.biic_chat_sbr"')
          s=s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
          s=s.replace('targetSdk flutter.targetSdkVersion', 'targetSdk 36')
          gradle.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Restore upload keystore from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 GitHub Secret."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD GitHub Secret."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD GitHub Secret."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS GitHub Secret."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Expected android/app/build.gradle.kts")
          s=p.read_text()
          if 'val keystoreProperties = Properties()' not in s:
              s='import java.io.FileInputStream\nimport java.util.Properties\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }\n}\n\n'+s
          marker='    buildTypes {'
          signing='    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n'
          if 'create("release")' not in s:
              s=s.replace(marker, signing+marker, 1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY

      - name: Verify Android release configuration
        run: |
          grep -q 'applicationId = "com.biicchat.biic_chat_sbr"' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          test -s android/upload-keystore.jks
          test -s android/key.properties

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release

      - name: Verify AAB
        run: test -s build/app/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: biic-chat-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
