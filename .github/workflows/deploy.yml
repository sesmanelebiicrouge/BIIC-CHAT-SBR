name: Deploy BIIC CHAT Web to GitHub Pages
# Production deployment: every push to main rebuilds and publishes GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biic-chat-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform files
        run: flutter create --platforms=web --org com.biicchat --project-name biic_chat_sbr .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Require production backend configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Missing SUPABASE_URL GitHub secret. Refusing to publish demo mode." && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Missing SUPABASE_PUBLISHABLE_KEY GitHub secret. Refusing to publish demo mode." && exit 1)
          echo "Supabase production configuration detected. Demo fallback is disabled for release publishing."
      - name: Install SVG conversion tool
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Prepare BIIC CHAT Web metadata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          logo_src = Path("assets/biic_logo.svg")
          logo_dst = Path("web/biic_logo.svg")
          logo_dst.write_text(logo_src.read_text())

          now = datetime.now(timezone.utc).date().isoformat()
          sitemap = Path("web/sitemap.xml")
          sitemap.write_text(f'''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/</loc><lastmod>{now}</lastmod></url>
            <url><loc>https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/privacy.html</loc><lastmod>{now}</lastmod></url>
            <url><loc>https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/terms.html</loc><lastmod>{now}</lastmod></url>
          </urlset>
          ''')

          Path("web/robots.txt").write_text('''User-agent: *
          Allow: /

          Sitemap: https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/sitemap.xml
          ''')

          p = Path("web/index.html")
          s = p.read_text()
          s = s.replace(
              '<meta name="description" content="A new Flutter project.">',
              '<meta name="description" content="BIIC CHAT — messagerie instantanée par numéro de téléphone, avec messages, médias, appels audio et vidéo.">'
          )
          s = s.replace("</head>", '''  <link rel="canonical" href="https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/">
          <meta property="og:title" content="BIIC CHAT">
          <meta property="og:description" content="BIIC CHAT — messagerie instantanée.">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/">
          <meta property="og:image" content="https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/biic_logo.png">
          <script type="application/ld+json">
          {"@context":"https://schema.org","@type":"SoftwareApplication","name":"BIIC CHAT","applicationCategory":"CommunicationApplication","operatingSystem":"Android, Web","description":"BIIC CHAT — application de messagerie instantanée.","url":"https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/","image":"https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/biic_logo.png"}
          </script>
          </head>''')
          s = s.replace(
              '<meta name="apple-mobile-web-app-title" content="biic_chat_sbr">',
              '<meta name="apple-mobile-web-app-title" content="BIIC CHAT">'
          )
          s = s.replace("<title>biic_chat_sbr</title>", "<title>BIIC CHAT</title>")
          p.write_text(s)

          m = Path("web/manifest.json")
          data = json.loads(m.read_text())
          data["name"] = "BIIC CHAT"
          data["short_name"] = "BIIC CHAT"
          data["background_color"] = "#FFFFFF"
          data["theme_color"] = "#D71920"
          data["description"] = "BIIC CHAT — messagerie instantanée."
          data["icons"] = [{"src": "biic_logo.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}]
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          rsvg-convert -w 512 -h 512 -o web/biic_logo.png assets/biic_logo.svg

      - name: Build Web release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release             --pwa-strategy=none             --base-href "/BIIC-CHAT-SBR/"             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify Web release output
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
          test -s build/web/biic_logo.svg
          test -s build/web/biic_logo.png
          test -s build/web/sitemap.xml
          test -s build/web/robots.txt
          grep -q 'BIIC CHAT' build/web/index.html

      - name: Publish gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
          commit_message: "deploy: BIIC CHAT web release ${{ github.sha }}"
