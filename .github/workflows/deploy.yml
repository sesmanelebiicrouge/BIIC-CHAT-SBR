name: Deploy BIIC CHAT Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biic-chat-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform files
        run: flutter create --platforms=web --org com.biicchat --project-name biic_chat_sbr .

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Prepare BIIC CHAT Web metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("web/index.html")
          s = p.read_text()
          s = s.replace('<meta name="description" content="A new Flutter project.">', '<meta name="description" content="BIIC CHAT — messagerie instantanée.">')
          s = s.replace('<meta name="apple-mobile-web-app-title" content="biic_chat_sbr">', '<meta name="apple-mobile-web-app-title" content="BIIC CHAT">')
          s = s.replace('<title>biic_chat_sbr</title>', '<title>BIIC CHAT</title>')
          p.write_text(s)
          m = Path("web/manifest.json")
          ms = m.read_text()
          ms = ms.replace('"name": "biic_chat_sbr"', '"name": "BIIC CHAT"')
          ms = ms.replace('"short_name": "biic_chat_sbr"', '"short_name": "BIIC CHAT"')
          ms = ms.replace('"background_color": "#0175C2"', '"background_color": "#FFFFFF"')
          ms = ms.replace('"theme_color": "#0175C2"', '"theme_color": "#D71920"')
          ms = ms.replace('"description": "A new Flutter project."', '"description": "BIIC CHAT — messagerie instantanée."')
          m.write_text(ms)
          PY

      - name: Build Web
        run: >
          flutter build web --release
          --base-href "/BIIC-CHAT-SBR/"
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: false
