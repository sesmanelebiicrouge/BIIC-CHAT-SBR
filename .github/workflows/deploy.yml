name: Deploy BIIC CHAT Web to GitHub Pages
# Production deployment: every push to main rebuilds and publishes GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biic-chat-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform files
        run: flutter create --platforms=web --org com.biicchat --project-name biic_chat_sbr .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          flutter test \
            --dart-define=SUPABASE_URL=https://ktiawqonbjhzzghksngr.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Fc0Ekq2igdnN-_dxIcDijQ_M0evXXoB

      - name: Validate production backend configuration
        run: |
          test -n "https://ktiawqonbjhzzghksngr.supabase.co"
          echo "BIIC CHAT production Supabase project is configured in the client."
          echo "The publishable key is bundled via AppConfig; no CI secret is required."


      - name: Smoke-test production Supabase endpoint
        run: |
          SUPABASE_URL='https://ktiawqonbjhzzghksngr.supabase.co'
          SUPABASE_KEY='sb_publishable_Fc0Ekq2igdnN-_dxIcDijQ_M0evXXoB'
          code=$(curl -sS -o /tmp/supabase-auth-settings.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/auth/v1/settings")
          if [ "$code" != "200" ]; then
            echo "::error::The configured Supabase project rejected the publishable key (HTTP $code)."
            cat /tmp/supabase-auth-settings.json
            exit 1
          fi
          echo "Supabase production endpoint is reachable and accepted the publishable key."

      - name: Install SVG conversion tool
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Prepare BIIC CHAT Web metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          logo_src = Path("assets/biic_logo.svg")
          logo_dst = Path("web/biic_logo.svg")
          logo_dst.write_text(logo_src.read_text())

          now = datetime.now(timezone.utc).date().isoformat()
          sitemap = Path("web/sitemap.xml")
          sitemap.write_text(f'''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/</loc><lastmod>{now}</lastmod></url>
            <url><loc>https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/privacy.html</loc><lastmod>{now}</lastmod></url>
            <url><loc>https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/terms.html</loc><lastmod>{now}</lastmod></url>
          </urlset>
          ''')

          Path("web/robots.txt").write_text('''User-agent: *
          Allow: /

          Sitemap: https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/sitemap.xml
          ''')

          p = Path("web/index.html")
          s = p.read_text()
          import os
          build_id = os.environ.get("GITHUB_SHA", "latest")[:12]
          # Version browser-visible assets to avoid stale cached logos after deployment.
          # Keep favicon.png at a stable URL for search crawlers; the file itself is replaced below.
          s = s.replace('href="manifest.json"', f'href="manifest.json?v={build_id}"')
          # Ensure browser tabs and crawlers use BIIC icons instead of Flutter defaults.
          s = s.replace('href="favicon.png"', 'href="biic_logo.png"')
          s = s.replace('href="icons/Icon-192.png"', f'href="biic_logo_192.png?v={build_id}"')
          s = s.replace(
              '<meta name="description" content="A new Flutter project.">',
              '<meta name="description" content="BIIC CHAT SBR espace NOUCHI est une application de messagerie instantanée permettant d’échanger des messages, de créer des groupes et de partager des médias en ligne.">'
          )
          s = s.replace("</head>", '''  <meta name="google-site-verification" content="cWgvvBx_bxvIABAnDz2XsY9-mtoICnqHkfrhUw2acLk" />
          <meta name="application-name" content="BIIC CHAT SBR espace NOUCHI">
          <meta name="apple-mobile-web-app-title" content="BIIC CHAT SBR espace NOUCHI">
          <link rel="canonical" href="https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/">
          <meta property="og:title" content="BIIC CHAT SBR espace NOUCHI">
          <meta property="og:description" content="BIIC CHAT SBR espace NOUCHI — messagerie instantanée pour échanger des messages, créer des groupes et partager des médias en ligne.">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/">
          <meta property="og:site_name" content="BIIC CHAT SBR espace NOUCHI">
          <meta property="og:image" content="https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/biic_logo.png">
          <meta name="twitter:card" content="summary">
          <meta name="twitter:title" content="BIIC CHAT SBR espace NOUCHI">
          <meta name="twitter:description" content="BIIC CHAT SBR espace NOUCHI — messagerie instantanée pour échanger des messages, créer des groupes et partager des médias.">
          <meta name="twitter:image" content="https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/biic_logo.png">
          <script type="application/ld+json">
          {"@context":"https://schema.org","@type":"WebSite","name":"BIIC CHAT SBR espace NOUCHI","alternateName":["BIIC CHAT","BigChat"],"url":"https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/"}
          </script>
          <script type="application/ld+json">
          {"@context":"https://schema.org","@type":"SoftwareApplication","name":"BIIC CHAT SBR espace NOUCHI","alternateName":["BIIC CHAT","BigChat"],"applicationCategory":"CommunicationApplication","operatingSystem":"Android, iOS, Web","description":"BIIC CHAT SBR espace NOUCHI est une application de messagerie instantanée permettant d’échanger des messages, de créer des groupes et de partager des médias en ligne.","url":"https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/","image":"https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/biic_logo.png"}
          </script>
          </head>''')
          s = s.replace(
              'https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/biic_logo.png"',
              f'https://sesmanelebiicrouge.github.io/BIIC-CHAT-SBR/biic_logo.png?v={build_id}"'
          )
          s = s.replace("</head>", f'<link rel="apple-touch-icon" href="biic_logo_192.png?v={build_id}">\n</head>')
          s = s.replace("<body>", '''<body>
          <noscript>
            <main>
              <h1>BIIC CHAT SBR espace NOUCHI</h1>
              <p>BIIC CHAT SBR espace NOUCHI est une application de messagerie instantanée pour échanger des messages, créer des groupes et partager des médias en ligne.</p>
              <p>Découvrez BIIC CHAT en Côte d’Ivoire et ouvrez l’application depuis cette page.</p>
            </main>
          </noscript>''')
          s = s.replace(
              '<meta name="apple-mobile-web-app-title" content="BIIC CHAT">',
              '<meta name="apple-mobile-web-app-title" content="BIIC CHAT SBR espace NOUCHI">'
          )
          s = s.replace("<title>biic_chat_sbr</title>", "<title>BIIC CHAT SBR espace NOUCHI — Messagerie instantanée</title>")
          install_script = r"""
          <script>
          (() => {
            let deferredPrompt = null;
            const createInstallButton = () => {
              if (document.getElementById("biic-install-app")) return;
              const button = document.createElement("button");
              button.id = "biic-install-app";
              button.type = "button";
              button.textContent = "📲 Installer BIIC CHAT";
              button.setAttribute("aria-label", "Installer BIIC CHAT");
              Object.assign(button.style, {
                position: "fixed",
                right: "16px",
                bottom: "16px",
                zIndex: "2147483647",
                padding: "12px 16px",
                border: "0",
                borderRadius: "999px",
                background: "#D71920",
                color: "#fff",
                font: "600 14px system-ui, sans-serif",
                boxShadow: "0 4px 16px rgba(0,0,0,.25)",
                cursor: "pointer"
              });
              button.addEventListener("click", async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                button.remove();
              });
              document.body.appendChild(button);
            };
            window.addEventListener("beforeinstallprompt", (event) => {
              event.preventDefault();
              deferredPrompt = event;
              createInstallButton();
            });
            window.addEventListener("appinstalled", () => {
              document.getElementById("biic-install-app")?.remove();
              deferredPrompt = null;
            });
          })();
          </script>
          """
          s = s.replace("</body>", install_script + "\n</body>")
          p.write_text(s)

          m = Path("web/manifest.json")
          data = json.loads(m.read_text())
          data["name"] = "BIIC CHAT SBR espace NOUCHI"
          data["short_name"] = "BIIC CHAT"
          data["background_color"] = "#FFFFFF"
          data["theme_color"] = "#D71920"
          data["description"] = "BIIC CHAT SBR espace NOUCHI — messagerie instantanée pour échanger des messages, créer des groupes et partager des médias en ligne."
          data["start_url"] = "/BIIC-CHAT-SBR/"
          data["scope"] = "/BIIC-CHAT-SBR/"
          data["display"] = "standalone"
          data["orientation"] = "portrait-primary"
          data["prefer_related_applications"] = False
          data["icons"] = [
              {"src": "biic_logo_192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},
              {"src": "biic_logo.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}
          ]
          data["shortcuts"] = [
              {"name": "Ouvrir BIIC CHAT", "short_name": "Chat", "url": "/BIIC-CHAT-SBR/", "icons": [{"src": "biic_logo_192.png", "sizes": "192x192", "type": "image/png"}]}
          ]
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          rsvg-convert -w 48 -h 48 -o web/biic_favicon_48.png assets/biic_logo.svg
          rsvg-convert -w 192 -h 192 -o web/biic_logo_192.png assets/biic_logo.svg
          rsvg-convert -w 512 -h 512 -o web/biic_logo.png assets/biic_logo.svg
          cp web/biic_logo.png web/favicon.png

      - name: Build Web release
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://ktiawqonbjhzzghksngr.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Fc0Ekq2igdnN-_dxIcDijQ_M0evXXoB \
            --pwa-strategy=none \
            --base-href "/BIIC-CHAT-SBR/"

      - name: Version Flutter Web entrypoints to refresh cached releases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          build_id = os.environ.get("GITHUB_SHA", "latest")[:12]
          index = Path("build/web/index.html")
          html = index.read_text()
          html = html.replace('src="flutter_bootstrap.js"', f'src="flutter_bootstrap.js?v={build_id}"')
          index.write_text(html)
          bootstrap = Path("build/web/flutter_bootstrap.js")
          js = bootstrap.read_text()
          js = js.replace("main.dart.js", f"main.dart.js?v={build_id}")
          bootstrap.write_text(js)
          PY
      - name: Verify Web release output
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
          test -s build/web/biic_logo.svg
          test -s build/web/biic_logo.png
          test -s build/web/biic_logo_192.png
          test -s build/web/biic_favicon_48.png
          test -s build/web/sitemap.xml
          test -s build/web/robots.txt
          test -s build/web/manifest.json
          grep -q 'biic_logo.png' build/web/manifest.json
          grep -q 'biic_logo_192.png' build/web/manifest.json
          grep -q '"display": "standalone"' build/web/manifest.json
          grep -q '"start_url": "/BIIC-CHAT-SBR/"' build/web/manifest.json
          grep -q '"shortcuts"' build/web/manifest.json
          grep -q 'Installer BIIC CHAT' build/web/index.html
          grep -q 'BIIC CHAT' build/web/index.html
          grep -q 'flutter_bootstrap.js?v=' build/web/index.html
          grep -q 'main.dart.js?v=' build/web/flutter_bootstrap.js
          grep -q 'BigChat' build/web/index.html
          ! grep -q 'github.com/sesmanelebiicrouge/BIIC-CHAT-SBR' build/web/index.html
          grep -q 'href="biic_favicon_48.png"' build/web/index.html
          grep -q 'href="biic_logo.png"' build/web/index.html
          grep -q 'biic_logo_192.png?v=' build/web/index.html
          grep -q 'alternateName' build/web/index.html

      - name: Publish gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
          commit_message: "deploy: BIIC CHAT web release ${{ github.sha }}"
