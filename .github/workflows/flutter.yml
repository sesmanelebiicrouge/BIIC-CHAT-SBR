name: Flutter CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web and Android platform files
        run: flutter create --platforms=web,android --org com.biicchat --project-name biic_chat_sbr .

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting without changing the checkout
        # Existing files still have formatting differences; keep this diagnostic non-mutating.
        run: dart format --output=none .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          flutter test \
            --dart-define=SUPABASE_URL=https://ktiawqonbjhzzghksngr.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Fc0Ekq2igdnN-_dxIcDijQ_M0evXXoB

      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://ktiawqonbjhzzghksngr.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Fc0Ekq2igdnN-_dxIcDijQ_M0evXXoB \
            --pwa-strategy=none \
            --base-href "/BIIC-CHAT-SBR/"

      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://ktiawqonbjhzzghksngr.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Fc0Ekq2igdnN-_dxIcDijQ_M0evXXoB
          test -s build/app/outputs/flutter-apk/app-debug.apk

