name: Flutter CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

# CI checks run on pull-request code and need no write permissions.
permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web and Android platform files
        run: flutter create --platforms=web,android --org com.biicchat --project-name biic_chat_sbr .

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        # Normalize legacy and newly added files before static analysis and tests.
        run: dart format .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          flutter test \
            --dart-define=SUPABASE_URL=https://ktiawqonbjhzzghksngr.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Fc0Ekq2igdnN-_dxIcDijQ_M0evXXoB

      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://ktiawqonbjhzzghksngr.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Fc0Ekq2igdnN-_dxIcDijQ_M0evXXoB \
            --pwa-strategy=none \
            --base-href "/BIIC-CHAT-SBR/"

      - name: Build Android debug APK (retry transient SDK/NDK download failures)
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug \
              --dart-define=SUPABASE_URL=https://ktiawqonbjhzzghksngr.supabase.co \
              --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Fc0Ekq2igdnN-_dxIcDijQ_M0evXXoB; then
              test -s build/app/outputs/flutter-apk/app-debug.apk
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Android build attempt $attempt failed; retrying in $((attempt * 15)) seconds in case the Android SDK/NDK download was interrupted."
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Android debug APK build failed after 3 attempts."
          exit 1

