name: BIIC CHAT iOS / App Store

on:
  workflow_dispatch:
    inputs:
      publish_testflight:
        description: "Signer et envoyer la build sur TestFlight"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ios:
    name: iOS build (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.biicchat.biic_chat_sbr
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.6.0"

      - name: Check Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.' || {
            echo "::error::This workflow requires Xcode 26 or newer."
            exit 1
          }

      - name: Generate iOS platform
        run: flutter create --platforms=ios --org com.biicchat --project-name biic_chat_sbr .

      - name: Set BIIC CHAT iOS metadata and permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Runner/Info.plist")
          s = p.read_text()
          replacements = {
              "<key>CFBundleDisplayName</key>\n\t<string>$(PRODUCT_NAME)</string>":
                  "<key>CFBundleDisplayName</key>\n\t<string>BIIC CHAT</string>",
              "<key>CFBundleName</key>\n\t<string>$(PRODUCT_NAME)</string>":
                  "<key>CFBundleName</key>\n\t<string>BIIC CHAT</string>",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          permissions = {
              "NSCameraUsageDescription": "BIIC CHAT utilise la caméra pour les photos et les appels vidéo.",
              "NSMicrophoneUsageDescription": "BIIC CHAT utilise le microphone pour les messages vocaux et les appels.",
              "NSPhotoLibraryUsageDescription": "BIIC CHAT utilise vos photos lorsque vous choisissez un média à envoyer.",
              "NSContactsUsageDescription": "BIIC CHAT utilise vos contacts uniquement lorsque vous choisissez de les importer ou partager.",
          }
          insert = ""
          for key, value in permissions.items():
              if f"<key>{key}</key>" not in s:
                  insert += f"\n\t<key>{key}</key>\n\t<string>{value}</string>"
          s = s.replace("</dict>", insert + "\n</dict>", 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Supabase production credentials
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Missing SUPABASE_PUBLISHABLE_KEY secret" && exit 1)
          code=$(curl -sS -o /tmp/supabase-auth-settings.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/settings")
          if [ "$code" != "200" ]; then
            echo "::error::Supabase credentials rejected by $SUPABASE_URL (HTTP $code)."
            cat /tmp/supabase-auth-settings.json
            exit 1
          fi
          echo "Supabase credentials validated successfully (HTTP 200)."

      - name: iOS simulator smoke build
        run: |
          flutter build ios --simulator --debug             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: biic-chat-ios-simulator
          path: build/ios/iphonesimulator/Runner.app

      - name: Require Apple release credentials
        if: ${{ inputs.publish_testflight }}
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          test -n "$APPSTORE_ISSUER_ID" || (echo "::error::Missing APPSTORE_ISSUER_ID repository variable" && exit 1)
          test -n "$APPSTORE_API_KEY_ID" || (echo "::error::Missing APPSTORE_API_KEY_ID repository variable" && exit 1)
          test -n "$APPSTORE_API_PRIVATE_KEY" || (echo "::error::Missing APPSTORE_API_PRIVATE_KEY secret" && exit 1)
          test -n "$APPSTORE_CERTIFICATES_FILE_BASE64" || (echo "::error::Missing APPSTORE_CERTIFICATES_FILE_BASE64 secret" && exit 1)
          test -n "$APPSTORE_CERTIFICATES_PASSWORD" || (echo "::error::Missing APPSTORE_CERTIFICATES_PASSWORD secret" && exit 1)
          test -n "$APPLE_TEAM_ID" || (echo "::error::Missing APPLE_TEAM_ID repository variable" && exit 1)

      - name: Import Apple distribution certificate
        if: ${{ inputs.publish_testflight }}
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        if: ${{ inputs.publish_testflight }}
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.biicchat.biic_chat_sbr
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Configure App Store signing
        if: ${{ inputs.publish_testflight }}
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          PROFILE_FILE=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name '*.mobileprovision' -print -quit)
          test -n "$PROFILE_FILE" || (echo "::error::No App Store provisioning profile was installed" && exit 1)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_FILE" | /usr/libexec/PlistBuddy -c 'Print :Name')
          echo "Using provisioning profile: $PROFILE_NAME"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/ExportOptions.plist")
          p.write_text("""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>__TEAM_ID__</string>
          <key>provisioningProfiles</key><dict>
          <key>com.biicchat.biic_chat_sbr</key><string>__PROFILE_NAME__</string>
          </dict>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          """)
          PY
          sed -i '' "s/__TEAM_ID__/$APPLE_TEAM_ID/g" ios/ExportOptions.plist
          sed -i '' "s/__PROFILE_NAME__/$PROFILE_NAME/g" ios/ExportOptions.plist
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        if: ${{ inputs.publish_testflight }}
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p build/ios/archive build/ios/ipa
          xcodebuild             -workspace ios/Runner.xcworkspace             -scheme Runner             -configuration Release             -sdk iphoneos             -archivePath build/ios/archive/BIIC-CHAT.xcarchive             -destination "generic/platform=iOS"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Manual             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"             PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"             OTHER_SWIFT_FLAGS='$(inherited)'             OTHER_LDFLAGS='$(inherited)'             -allowProvisioningUpdates             archive

          xcodebuild -exportArchive             -archivePath build/ios/archive/BIIC-CHAT.xcarchive             -exportOptionsPlist ios/ExportOptions.plist             -exportPath build/ios/ipa

      - name: Upload IPA artifact
        if: ${{ inputs.publish_testflight }}
        uses: actions/upload-artifact@v4
        with:
          name: biic-chat-ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        if: ${{ inputs.publish_testflight }}
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"
