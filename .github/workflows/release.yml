name: Release BIIC CHAT

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  android-release:
    name: Android AAB (API 36+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.biicchat --project-name biic_chat_sbr .

      - name: Install SVG conversion tool
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Install BIIC CHAT launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          rsvg-convert -w 48 -h 48 -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png assets/biic_logo.svg
          rsvg-convert -w 72 -h 72 -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png assets/biic_logo.svg
          rsvg-convert -w 96 -h 96 -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png assets/biic_logo.svg
          rsvg-convert -w 144 -h 144 -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png assets/biic_logo.svg
          rsvg-convert -w 192 -h 192 -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png assets/biic_logo.svg
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Set application label
        run: sed -i 's/android:label="biic_chat_sbr"/android:label="BIIC CHAT"/' android/app/src/main/AndroidManifest.xml

      - name: Configure Android 16 target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in (Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")):
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              s = s.replace("compileSdk flutter.compileSdkVersion", "compileSdk 36")
              s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
              s = s.replace("targetSdk flutter.targetSdkVersion", "targetSdk 36")
              p.write_text(s)
          PY
          grep -RqsE 'targetSdk[^0-9]*36|targetSdkVersion[^0-9]*36' android/app

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Check release credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ANDROID_KEY_PROPERTIES" || (echo "Missing ANDROID_KEY_PROPERTIES secret" && exit 1)

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties

      - name: Build signed Android App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY secret" && exit 1)
          code=$(curl -sS -o /tmp/supabase-auth-settings.json -w "%{http_code}" \\
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \\
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \\
            "$SUPABASE_URL/auth/v1/settings")
          if [ "$code" != "200" ]; then
            echo "::error::Supabase credentials rejected by $SUPABASE_URL (HTTP $code). Check that SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY belong to the same project and that the key is a publishable/anon key, not a secret/service_role key."
            cat /tmp/supabase-auth-settings.json
            exit 1
          fi
          echo "Supabase credentials validated successfully (HTTP 200)."
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: biic-chat-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish Android to Google Play internal testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.biicchat.biic_chat_sbr
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          changesNotSentForReview: true

  web-release:
    name: Web release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform
        run: flutter create --platforms=web --org com.biicchat --project-name biic_chat_sbr .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY secret" && exit 1)
          code=$(curl -sS -o /tmp/supabase-auth-settings.json -w "%{http_code}" \\
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \\
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \\
            "$SUPABASE_URL/auth/v1/settings")
          if [ "$code" != "200" ]; then
            echo "::error::Supabase credentials rejected by $SUPABASE_URL (HTTP $code)."
            cat /tmp/supabase-auth-settings.json
            exit 1
          fi
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: biic-chat-web
          path: build/web
