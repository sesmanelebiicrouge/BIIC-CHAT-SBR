# Supabase local and deployment configuration for BIIC CHAT.
# Auth hooks are authenticated by Standard Webhooks signatures, not user JWTs.
# Each hook verifies its own signature before processing the payload.

[functions.send-sms]
verify_jwt = false

[functions.send-email]
verify_jwt = false

# User-facing phone-registration flow verifies the caller's JWT itself.
[functions.phone-registration]
verify_jwt = true
