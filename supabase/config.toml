# Supabase local and deployment configuration for BIIC CHAT.
# The Send SMS Auth Hook is authenticated by Standard Webhooks signatures,
# not by a Supabase user JWT. The function verifies that signature itself.
[functions.send-sms]
verify_jwt = false

# User-facing email OTP flow; this function verifies the caller's JWT itself as well.
[functions.phone-registration]
verify_jwt = true
